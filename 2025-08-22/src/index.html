<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" type="text/css" href="styles/style.css" />
  <title>Document</title>
  
</head>
<body>
  <header>
    <nav class="flex justify-between py-16 px-24">

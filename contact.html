<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>კონტაქტი</title>
</head>
<body>
  <nav>
    <a href="index.html">მთავარი</a> |
    <a href="about.html">ჩვენ შესახებ</a> |
    <a href="contact.html">კონტაქტი</a>
  </nav>

  <h1>დაგვიკავშირდით</h1>
  <p>თქვენი შეტყობინება.</p>

  <img src="https://picsum.photos/seed/contact/800/300" alt="კონტაქტის ფოტო">

  <form action="index.html" method="get">
    <div>
      <label for="fullName">სახელი და გვარი:</label>
      <input type="text" id="fullName" name="fullName" required>
    </div>
    <div>
      <label for="email">ელ.ფოსტა:</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div>
      <label for="message">შეტყობინება:</label>
      <textarea id="message" name="message" rows="5" required></textarea>
    </div>
    <div>
      <button type="submit">გაგზავნა</button>
    </div>
  </form>

  <footer>
    <p><a href="index.html">დაბრუნება მთავარზე</a></p>
  </footer>
</body>
</html>
